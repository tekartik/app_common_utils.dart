name: tekartik_app_agent_mcp
description: An MCP server (stdio) bridging an agent client (Claude Code...) to the commands of a running app (tekartik_app_agent) - through the VM service of a debug or profile run, or a Chrome page over the DevTools protocol (the web js bridge, release builds included).
version: 0.2.0
homepage: https://github.com/tekartik/app_common_utils.dart
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  args: ">=2.6.0"
  dart_mcp: ">=0.5.2"
  vm_service: ">=15.0.0"
  tekartik_app_agent:
    git:
      url: https://github.com/tekartik/app_common_utils.dart
      path: app_agent

dev_dependencies:
  stream_channel: ">=2.1.4"
  test: ">=1.31.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints

executables:
  tekartik_app_agent_mcp:

resolution: workspace
