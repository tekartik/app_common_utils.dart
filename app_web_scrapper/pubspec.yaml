name: tekartik_app_web_scrapper
description: Static web site scrapper, crawl pages and follow their links (html, css, javascript) to save a site to a fs_shim directory.
version: 0.1.1
homepage: https://github.com/tekartik/app_common_utils.dart
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  args: ">=2.7.0"
  fs_shim: ">=2.5.7"
  http: ">=1.2.0"
  path: ">=1.9.1"
  tekartik_app_http:
    git:
      url: https://github.com/tekartik/app_common_utils.dart
      path: app_http
    version: '>=0.2.0'
  tekartik_html:
    git:
      url: https://github.com/tekartik/html.dart
    version: '>=0.3.1'

dev_dependencies:
  dev_build: ">=1.1.8+1"
  process_run: ">=1.3.4"
  test: ">=1.31.0"

executables:
  web_scrapper:

resolution: workspace
