name: tekartik_app_agent
description: Helpers for the apps an agent (an LLM, a test tool) drives, pure Dart - the agent url options (?semantics, ?agent) and a driver of the Flutter web semantics ids through a page evaluate function.
version: 0.1.0
homepage: https://github.com/tekartik/app_common_utils.dart
publish_to: none

environment:
  sdk: ^3.12.0

dev_dependencies:
  test: ">=1.31.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints

resolution: workspace
